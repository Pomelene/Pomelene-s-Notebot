plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def compatibility = new groovy.json.JsonSlurper().parse(file('compatibility.json'))
def targetMinecraft = providers.gradleProperty('mcVersion').getOrElse(project.minecraft_version)
def target = compatibility.targets[targetMinecraft]
if (target == null) throw new GradleException("Unsupported Minecraft target: ${targetMinecraft}; choose ${compatibility.targets.keySet()}")
def profile = providers.gradleProperty('fabricProfile').getOrElse('baseline')
if (!(profile in ['baseline', 'latest'])) throw new GradleException('fabricProfile must be baseline or latest')
def runtimeLoader = providers.gradleProperty('loaderVersion').getOrElse(profile == 'latest' ? compatibility.latestLoader : target.minLoader)
def runtimeApi = providers.gradleProperty('fabricApiVersion').getOrElse(profile == 'latest' ? target.latestApi : target.minApi)
def testMode = providers.gradleProperty('notebotTestSuite').getOrElse(project.hasProperty('notebotDetectionTest') ? 'detection' : project.hasProperty('notebotUiSmoke') ? 'ui' : 'gameplay')
def testClasses = [gameplay: 'NotebotGameTest', detection: 'NotebotDetectionTest', ui: 'NotebotUiSmokeTest', matrix: 'NotebotMatrixTest', controls: 'NotebotControlEventsTest']
if (!testClasses.containsKey(testMode)) throw new GradleException("Unknown test suite: ${testMode}")

version = "${project.mod_version}+${targetMinecraft}"
group = project.maven_group
base { archivesName = 'pomelene-notebot' }
// Keep outputs from different versions and runtime environments isolated.
layout.buildDirectory = file("build/${targetMinecraft}/${profile}")
sourceSets.main.java.srcDir("src/platform/${target.adapter}/java")

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${targetMinecraft}"
    // Loom derives Mixin/ASM bootstrap libraries from this dependency.
    implementation "net.fabricmc:fabric-loader:${runtimeLoader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${target.minApi}"
    runtimeOnly "net.fabricmc.fabric-api:fabric-api:${runtimeApi}"
    implementation 'com.atilika.kuromoji:kuromoji-core:0.9.0'
    implementation 'com.atilika.kuromoji:kuromoji-ipadic:0.9.0'
    include 'com.atilika.kuromoji:kuromoji-core:0.9.0'
    include 'com.atilika.kuromoji:kuromoji-ipadic:0.9.0'
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.properties(version: project.version, minecraft: targetMinecraft, minLoader: target.minLoader, minApi: target.minApi.split('\\+')[0])
    filesMatching('fabric.mod.json') { expand inputs.properties }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
test { useJUnitPlatform() }
if(project.hasProperty('notebotNbs6Fixture')) {
    test { systemProperty 'notebot.test.nbs6', project.property('notebotNbs6Fixture') }
}
jar { from('LICENSE') { rename { "${it}_pomelene-notebot" } } }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'pomelene_notebot_test'
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = false
    }
}

// Optional user-supplied regression fixtures stay outside source/release archives.
if (project.hasProperty('notebotStageFixture')) {
    loom.runs.clientGameTest.vmArg "-Dnotebot.test.stage=${project.property('notebotStageFixture')}"
}
if (project.hasProperty('notebotSongFixture')) {
    loom.runs.clientGameTest.vmArg "-Dnotebot.test.song=${project.property('notebotSongFixture')}"
}
if (project.hasProperty('notebotLibraryFixture')) {
    loom.runs.clientGameTest.vmArg "-Dnotebot.test.library=${project.property('notebotLibraryFixture')}"
}

tasks.withType(ProcessResources).configureEach {
    inputs.property 'notebotTestMode', testMode
    if (name == 'processGametestResources') {
        filesMatching('fabric.mod.json') {
            filter { line -> line.replace('com.pomelene.notebot.NotebotGameTest', "com.pomelene.notebot.${testClasses[testMode]}") }
        }
    }
}

tasks.register('showCompatibility') {
    doLast { println "Minecraft ${targetMinecraft}; compile Loader ${runtimeLoader}, API ${target.minApi}; runtime Loader ${runtimeLoader}, API ${runtimeApi}; suite ${testMode}" }
}

// The same game target produces identical artifacts for both Fabric runtime profiles.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Fabric's test plugin otherwise reuses build/run/clientGameTest across all targets.
loom.runs.configureEach {
    runDir("build/${targetMinecraft}/${profile}/run/${name}")
}
